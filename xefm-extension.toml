[extension]
id = "mail-archive"
version = "0.1.1"
api_version = 1
name = "Mail Archive"
description = "Browse .eml and .msg files read-only as virtual folders (headers, body, attachments)."
min_xefm = "1.10.0"
updates = "github:SinisterSoftware/xefm-mail-archive"

[contributes.path_schemes]
eml = "mail_archive.logic:EML_SCHEME"
msg = "mail_archive.logic:MSG_SCHEME"

[contributes.actions]
"mail_archive.open" = "mail_archive.logic:open_focused_mail_archive"

[contributes.event_hooks]
file_open = "mail_archive.logic:open_mail_archive"

[requires]
python_packages = ["extract-msg"]
